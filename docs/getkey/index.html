<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1NXITER HUB — Sua Key</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d0a12;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #16111f;
            border: 1px solid #2a1f3d;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 { color: #b366ff; font-size: 22px; margin-bottom: 6px; }
        .sub { color: #888; font-size: 13px; margin-bottom: 28px; }
        .key-box {
            background: #1e1630;
            border: 2px solid #7b3dcf;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #d4a0ff;
            letter-spacing: 2px;
            user-select: all;
            word-break: break-all;
        }
        button {
            padding: 12px 28px;
            background: #7b3dcf;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background: #9a5ce8; }
        .info {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .copied {
            color: #4caf50;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .timer { color: #ff9800; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 1NXITER HUB</h1>
        <p class="sub">Sua key gratuita do dia</p>

        <div class="key-box" id="keyDisplay">Carregando...</div>
        <div class="timer" id="timer"></div>

        <button onclick="copyKey()">📋 COPIAR KEY</button>
        <div class="copied" id="copiedMsg">✅ Key copiada! Cole no hub.</div>

        <div class="info">
            Esta key é válida por 24h e muda à meia-noite (UTC).<br>
            Cole no hub quando pedir a key.<br><br>
            Quer uma key <b>permanente</b>? Fale com o admin no Discord.
        </div>
    </div>

    <script>
        // Algoritmo idêntico ao do hub (main.lua) — DEVE ser igual
        function getDailyKey() {
            const secret = "1NXITER-DAILY-2026";
            const now = new Date();
            const today = now.getUTCFullYear() + '-'
                + String(now.getUTCMonth() + 1).padStart(2, '0') + '-'
                + String(now.getUTCDate()).padStart(2, '0');
            const combined = secret + today;
            let hash = 0;
            for (let i = 0; i < combined.length; i++) {
                hash = (hash * 31 + combined.charCodeAt(i)) % 2147483647;
            }
            return "1NX-FREE-" + hash.toString(16).toUpperCase().padStart(8, '0');
        }

        function updateTimer() {
            const now = new Date();
            const tomorrow = new Date(Date.UTC(
                now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1
            ));
            const diff = tomorrow - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer').textContent =
                'Expira em: ' + h + 'h ' + m + 'm ' + s + 's';
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').textContent;
            navigator.clipboard.writeText(key).then(() => {
                const msg = document.getElementById('copiedMsg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            });
        }

        document.getElementById('keyDisplay').textContent = getDailyKey();
        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
